apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: k8s-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: k8s-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: a2a
              containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: K8S_AGENT_BASE_URL
              value: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
            - name: K8S_MCP_URL
              value: {{ .Values.k8sMcpUrl | quote }}
            - name: K8S_AGENT_MODEL
              value: {{ .Values.model | quote }}
            - name: K8S_AGENT_TEMPERATURE
              value: {{ .Values.temperature | quote }}
            - name: A2A_TASK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingTaskDatabaseSecret is required" .Values.existingTaskDatabaseSecret | quote }}
                  key: {{ .Values.taskDatabaseSecretKey | quote }}
            {{- if .Values.existingSecret }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: GOOGLE_API_KEY
            {{- end }}
            {{- if .Values.existingK8sMcpSecret }}
            - name: K8S_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingK8sMcpSecret | quote }}
                  key: {{ .Values.k8sMcpSecretKey | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
